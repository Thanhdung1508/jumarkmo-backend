# Chỉ lắng nghe máy hiện tại. Frontend gọi qua proxy /api để cookie cùng origin.
server.address=127.0.0.1
server.port=${API_PORT:3001}
server.error.include-message=never
server.error.include-stacktrace=never
spring.application.name=jumarkmo-backend
app.origin=${APP_ORIGIN:http://127.0.0.1:5173}
app.mail-directory=${MAIL_DIRECTORY:.local/mail}
app.database.url=${DATABASE_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/juniormark?stringtype=unspecified}
app.database.username=${DATABASE_USER:postgres}
app.database.password=${DATABASE_PASSWORD:}
app.database.password-file=${DATABASE_PASSWORD_FILE:.local/postgres-password.local}
